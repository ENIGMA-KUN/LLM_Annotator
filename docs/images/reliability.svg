<g class="ci"><line x1="706.7" y1="420.0" x2="757.3" y2="420.0"/><line x1="706.7" y1="416.0" x2="706.7" y2="424.0"/><line x1="757.3" y1="416.0" x2="757.3" y2="424.0"/></g>
