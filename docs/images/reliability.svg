<line class="gate" x1="584.5" y1="138.0" x2="584.5" y2="456.0"/>
<text class="ink" x="584.5" y="132.0" font-size="12" font-weight="600" text-anchor="middle">0.50 automation gate</text>
<text class="muted tnum" x="382.9" y="474.0" font-size="11.5" text-anchor="middle">0.00</text>
<text class="muted tnum" x="483.7" y="474.0" font-size="11.5" text-anchor="middle">0.25</text>
<text class="muted tnum" x="584.5" y="474.0" font-size="11.5" text-anchor="middle">0.50</text>
<text class="muted tnum" x="685.2" y="474.0" font-size="11.5" text-anchor="middle">0.75</text>
<text class="muted tnum" x="786.0" y="474.0" font-size="11.5" text-anchor="middle">1.00</text>
<text class="muted" x="382.9" y="492.0" font-size="11.5">0 is chance agreement, 1 is perfect</text>
<text class="muted" x="32.0" y="514.0" font-size="11.5">Experts: 200 questions from four OpenStax textbooks, two trained raters, 1 to 4 scale. LLM: 100-question test split, 3 runs</text>
<text class="muted" x="32.0" y="530.0" font-size="11.5">per question; each criterion shows its best of 9 setups, so the bars are an upper estimate. Intervals are item-level bootstrap.</text>
