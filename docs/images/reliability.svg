<g class="ci"><line x1="393.7" y1="346.0" x2="536.9" y2="346.0"/><line x1="393.7" y1="342.0" x2="393.7" y2="350.0"/><line x1="536.9" y1="342.0" x2="536.9" y2="350.0"/></g>
<text class="ink tnum" x="544.9" y="350.0" font-size="12" font-weight="600">0.219</text>
