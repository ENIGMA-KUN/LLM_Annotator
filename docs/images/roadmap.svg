<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" width="860" height="560" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Where the project is</title>
<desc id="d">Research status. Done: 45 configurations: 3 models, 3 prompts, 5 criteria, 3 runs each; Expert ceiling on all 200 questions, with intervals; Routing protocol with blind expert review and label provenance; Targeted review beats random: alpha 0.762 vs 0.659 at a 30% budget (Relevance); Fairness audit by subject, difficulty and passage length; Negative result: automated prompt optimisation collapses to constant scores. In progress: Retrieval few-shot: an offline probe finds label signal for Relevance and Plausibility; Rubric rewrite from holistic 1 to 4 levels to atomic yes/no checks; Checking that each prompt shows the model the same object the experts judged. Next: Live A/B test on Semantic Plausibility, about 40 questions × 3 runs; Live pairwise judge on the three criteria that stay with experts; Grow the benchmark to about 300 questions to tighten the intervals; Link quality scores to student performance data.</desc>
