  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="859" height="547" rx="12"/>
<rect class="rule" x="32" y="28" width="44" height="4" rx="2"/>
<text class="ink" x="32" y="62" font-size="22" font-weight="600">Where an LLM can stand in for an expert</text>
<text class="ink2" x="32.0" y="86.0" font-size="13">Agreement on five quality criteria for multiple-choice questions, measured as Krippendorff's alpha (ordinal).</text>
<rect class="llm" x="32" y="108" width="12" height="12" rx="3"/>
<text class="ink2" x="50.0" y="118.0" font-size="12.5">LLM, best of 3 models × 3 prompts</text>
